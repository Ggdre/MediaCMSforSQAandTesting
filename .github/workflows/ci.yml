# Simplified CI for coursework repo: run tests only (no pre-commit, no release).
name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**/README.md", "**.md"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**/README.md", "**.md"]

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
